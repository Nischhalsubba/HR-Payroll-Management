name: Refresh patched fast-uri lock

on:
  push:
    branches:
      - security/prototype-auth-boundary
    paths:
      - app/package.json
      - app/package-lock.json
      - .github/workflows/refresh-fast-uri-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.repository == 'Nischhalsubba/HR-Payroll-Management'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: security/prototype-auth-boundary

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Regenerate package lock with patched override
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean install from regenerated lock
        run: npm ci --ignore-scripts

      - name: Verify high-severity dependency gate
        run: npm audit --audit-level=high

      - name: Commit regenerated lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already matches the patched dependency tree."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: refresh patched dependency lock"
          git push origin HEAD:security/prototype-auth-boundary
