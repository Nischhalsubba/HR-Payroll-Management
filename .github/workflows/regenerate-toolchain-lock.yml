name: Regenerate supported toolchain lock

on:
  push:
    branches:
      - maintenance/supported-toolchain-2026-09
    paths:
      - app/package.json
      - .github/workflows/regenerate-toolchain-lock.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: maintenance/supported-toolchain-2026-09
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Verify npm version
        working-directory: app
        run: test "$(npm --version)" = "11.17.0"
      - name: Regenerate lockfile
        working-directory: app
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install and dependency audit
        working-directory: app
        run: npm ci --ignore-scripts --no-audit --no-fund && npm audit --audit-level=low
      - name: Run project checks
        working-directory: app
        run: npm run check
      - name: Commit verified lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
          else
            git commit -m "chore: regenerate supported toolchain lockfile"
            git push
          fi
